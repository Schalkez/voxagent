name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Ruff Check (Linter)
      run: ruff check .

    - name: Security Check (Bandit)
      run: bandit -c pyproject.toml -r core/ skills/ api/

    - name: Check Dead Code (Vulture)
      run: vulture .
      
    - name: Documentation Coverage (Interrogate)
      run: interrogate -c pyproject.toml
      
    - name: Run Tests (Pytest)
      run: pytest tests/ --cov
